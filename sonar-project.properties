# SonarQube analysis settings. The token is NOT stored here: locally it comes
# from the SONAR_TOKEN environment variable, in CI from GitHub Secrets.
sonar.projectKey=PPL-IndoLegalBench-Client
sonar.projectName=PPL-IndoLegalBench Client

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated from the OpenAPI contract, not code the team writes by hand.
sonar.exclusions=src/lib/generated/**

# Tailwind CSS v4 at-rules such as @theme are valid CSS for our build, but Sonar's CSS rule
# "at-rules should be valid" (css:S4662) does not know them. @theme cannot be removed: it maps
# the Geist fonts behind font-sans and font-mono. Ignored only in globals.css, where Tailwind
# is set up, so a real typo in any other stylesheet is still reported.
sonar.issue.ignore.multicriteria=tailwindAtRules
sonar.issue.ignore.multicriteria.tailwindAtRules.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwindAtRules.resourceKey=src/app/globals.css
