# SonarQube analysis settings. The token is NOT stored here: locally it comes
# from the SONAR_TOKEN environment variable, in CI from GitHub Secrets.
sonar.projectKey=PPL-IndoLegalBench-Client
sonar.projectName=PPL-IndoLegalBench Client

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated from the OpenAPI contract, not code the team writes by hand.
sonar.exclusions=src/lib/generated/**
