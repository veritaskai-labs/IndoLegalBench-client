# Konfigurasi analisis SonarQube. Token TIDAK ditulis di sini:
# lokal lewat variabel lingkungan SONAR_TOKEN, di CI lewat GitHub Secrets.
sonar.projectKey=PPL-IndoLegalBench-Client
sonar.projectName=PPL-IndoLegalBench Client

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tipe hasil generate dari kontrak OpenAPI, bukan kode tulisan tim.
sonar.exclusions=src/lib/generated/**
