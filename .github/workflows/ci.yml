name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

      # No-op until someone adds a "test" script to package.json, then this
      # step starts enforcing tests on its own. Whoever wires up Vitest must
      # also bump node-version above: Vitest 5 needs Node >= 22.12.
      - run: npm run test --if-present

      - run: npm run build
