name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Branch protection uses this job name as the required check. Do not rename it.
  build:
    runs-on: ubuntu-latest
    env:
      # Empty until the secrets are set. Read by the SonarQube step's if:.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube needs the full history to work out what is new code.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Vitest 5 needs Node >= 22.12.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API types and the case zod schema
        run: npm run gen:api && npm run gen:zod

      - name: Check generated types are committed
        run: git diff --exit-code src/lib/generated

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --coverage --coverage.reporter=lcov --coverage.reporter=text

      # Community Build keeps one dashboard per project, so the analysis only
      # runs on merges to staging. Running it per PR would let a PR branch
      # overwrite the staging result.
      # The step skips itself while the SONAR_TOKEN secret is unset, and
      # continue-on-error keeps an unreachable SonarQube from failing the
      # required build check.
      - name: SonarQube scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Build
        run: npm run build

      # Not pushed to a registry yet, this only proves the image builds and
      # serves a page. The API address is a placeholder: nothing calls it here.
      - name: Build image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid -t indolegalbench-client:${{ github.sha }} .

      - name: Smoke test image
        run: |
          docker run -d --name web -p 3000:3000 indolegalbench-client:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "Image serves /login"; exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not serve /login within 60 seconds."
          docker logs web
          exit 1
